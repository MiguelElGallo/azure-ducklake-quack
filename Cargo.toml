[workspace]
members = [
    "crates/client",
    "crates/gateway",
    "crates/policy",
    "crates/runtime",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MiguelElGallo/azure-ducklake-quack"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.5.48", features = ["derive", "env"] }
duckdb = { version = "1.10505.0", features = ["bundled"] }
futures-util = "0.3.31"
http = "1.3.1"
native-tls = "0.2.14"
postgres-native-tls = "0.5.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.13", features = ["runtime"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
