name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout >/dev/null

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/*.sh spikes/dbt/*.sh tests/spike/*.sh

  dbt-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag azdq-dbt-spike:ci --file docker/dbt-spike.Dockerfile .
      - run: >-
          docker run --rm --network none
          --env DBT_TARGET=local
          --env DBT_SPIKE_RUN_ID=ci
          --env DUCKLAKE_METADATA_PATH=/tmp/azdq-dbt-spike/metadata.ducklake
          --env DUCKLAKE_DATA_PATH=/tmp/azdq-dbt-spike/data/
          azdq-dbt-spike:ci

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: ./tests/spike/quack-postgres.sh
